services:
  db:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-complaints}
      POSTGRES_USER: ${POSTGRES_USER:-complaints}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complaints} -d ${POSTGRES_DB:-complaints}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
